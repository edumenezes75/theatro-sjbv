name: Lighthouse

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'   # toda segunda, 9h UTC

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Aguardar o deploy da Vercel concluir
        run: sleep 90

      - name: Rodar Lighthouse nas paginas principais
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://www.theatromunicipalsjbv.com.br/
            https://www.theatromunicipalsjbv.com.br/historia
            https://www.theatromunicipalsjbv.com.br/acervo
            https://www.theatromunicipalsjbv.com.br/documentario
            https://www.theatromunicipalsjbv.com.br/programacao
            https://www.theatromunicipalsjbv.com.br/livro-de-memorias
          numberOfRuns: 2
          uploadArtifacts: true   # relatorios ficam como artefato baixavel da run
          # temporaryPublicStorage removido: era o passo que fazia a run falhar (servidor LHCI instavel)
